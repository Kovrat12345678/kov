<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SYS://OVERRIDE</title>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>

<body>
    <canvas id="matrix-canvas"></canvas>
    <div class="scanline-overlay"></div>

    <button class="sound-toggle" id="soundToggle" title="Hang ki/be">🔊</button>

    <div class="terminal-container">
        <audio id="voicePlayer" style="display:none"></audio>
        <div class="terminal-window" id="terminalWindow">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span class="terminal-dot"></span>
                    <span class="terminal-dot"></span>
                    <span class="terminal-dot"></span>
                </div>
                <div class="terminal-title">⚡ SYSTEM BREACH ACTIVE ⚡</div>
            </div>
            <div class="terminal-body" id="terminalBody">
                <!-- Terminal lines appear here -->
            </div>
            <div class="victim-input-area" id="victimInputArea">
                <div style="display: flex; align-items: center; width: 100%;">
                    <span class="prompt">&gt;</span>
                    <input type="text" id="victimInput" placeholder="Kattints ide az íráshoz...">
                    <button id="victimSendBtn" class="victim-send-btn">✈️ KÜLDÉS</button>
                </div>
            </div>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span>CONNECTION: ACTIVE</span>
            </div>
            <span id="statusTarget">TARGET: LOCKED</span>
        </div>
    </div>
    </div>

    <div class="notice-overlay" id="noticeOverlay">
        <div class="notice-text">
            HAMAROSAN JELENTKEZEM.
        </div>
    </div>

    <script src="hack.js?v=1.1"></script>
</body>

</html>
